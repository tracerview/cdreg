[package]
name = "cdreg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cdreg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.63"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
